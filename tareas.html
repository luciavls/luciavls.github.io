<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tareas</title>
<style>
  :root { --bg:#e4e4e2; --card:#f2f2f0; --ink:#141414; --mute:#3d4046; --line:#141414; --soft:#c4c4c2; --acc:#ee6a45; --accd:#a83512; --mint:#a8d5b0; --dark:#1e2024; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 "Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif; }
  .mono { font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; text-transform:uppercase; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; background:transparent; border:1px solid var(--line); border-radius:99px; padding:7px 14px; font-size:12px; }
  button:hover { background:var(--ink); color:#fff; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#141414; font-weight:700; }
  button.primary:hover { background:#ff8764; color:#141414; }
  input, select, textarea { background:var(--card); border:1px solid #7b7f86; border-radius:10px; padding:8px 12px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; padding:28px 48px 0; }
  .top b { font-size:20px; letter-spacing:-.01em; }
  .top .r { display:flex; gap:8px; flex-wrap:wrap; }
  .wrap { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:48px; padding:40px 48px 64px; }
  @media (max-width:900px){ .wrap { grid-template-columns:1fr; padding:24px 18px 48px; gap:32px; } .top { padding:20px 18px 0; } }
  .big { position:relative; display:inline-block; font-size:clamp(110px,16vw,220px); line-height:.85; font-weight:800; letter-spacing:-.05em; }
  .big i { position:absolute; right:-10px; bottom:-6px; width:44%; aspect-ratio:1; max-width:96px; background:var(--acc); z-index:-1; }
  .lbl { font-size:30px; font-weight:700; line-height:1.1; margin-top:28px; }
  .tags { margin-top:18px; display:flex; gap:8px; flex-wrap:wrap; }
  .mint { font-size:12px; background:var(--mint); padding:2px 6px; display:inline-block; }
  .mint.warn { background:var(--acc); }
  .box { margin-top:36px; border:2px solid var(--line); border-radius:16px; padding:18px; background:var(--card); }
  .box h3 { margin:0 0 10px; font-size:12px; font-weight:500; color:var(--mute); }
  .drop { border:2px dashed #7b7f86; border-radius:12px; padding:26px 12px; text-align:center; cursor:pointer; font-size:17px; }
  .drop.over { background:rgba(238,106,69,.15); border-color:var(--acc); }
  .gf { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 0; border-bottom:1px solid var(--soft); font-size:14px; }
  .gf:last-child { border-bottom:0; }
  .gf .n { flex:1; min-width:120px; word-break:break-all; }
  .gf a { color:var(--ink); cursor:pointer; text-decoration:underline; }
  .gf select { padding:4px 8px; font-size:12px; max-width:170px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { font-size:12px; padding:8px 14px; }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .chip.warn[aria-pressed="false"] { border-color:var(--accd); color:var(--accd); }
  .chip.warn[aria-pressed="true"] { background:var(--acc); border-color:var(--acc); color:#141414; }
  .list { margin-top:18px; border-top:3px solid var(--line); }
  .grp { margin:22px 0 0; font-size:12px; color:var(--mute); }
  .grp.warn { color:var(--accd); font-weight:600; }
  .row { display:grid; grid-template-columns:90px minmax(0,1fr) auto; gap:16px; align-items:start; padding:18px 0; border-bottom:1px solid var(--line); }
  @media (max-width:560px){ .row { grid-template-columns:1fr; gap:8px; } }
  .row.over { background:rgba(238,106,69,.12); }
  .row.late .dt { color:var(--accd); font-weight:500; }
  .row.doing { background:var(--dark); color:#fff; margin:0 -14px; padding:18px 14px; border-radius:10px; }
  .row.doing .dt { color:#ff9577; } .row.doing .sub, .row.doing .nt { color:#c9ccd1; } .row.doing .files a { color:#fff; }
  .row.done .ti { text-decoration:line-through; color:#4a4d52; }
  .dt { font-size:13px; }
  .ti { font-size:24px; font-weight:700; line-height:1.12; word-break:break-word; }
  .nt { font-size:14px; color:var(--mute); margin-top:6px; white-space:pre-wrap; word-break:break-word; }
  .files a { display:inline-block; margin:8px 14px 0 0; font-size:13px; text-decoration:underline; cursor:pointer; color:var(--ink); }
  .pill { font-size:12px; border:1px solid currentColor; padding:3px 9px; border-radius:99px; white-space:nowrap; display:inline-block; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .acts button { padding:3px 10px; font-size:11px; }
  .row.doing .acts button { border-color:#fff; } .row.doing .acts button:hover { background:#fff; color:#141414; }
  .empty { padding:28px 0; color:var(--mute); }
  dialog { border:2px solid var(--line); border-radius:18px; background:var(--card); color:var(--ink); width:min(500px,94vw); }
  dialog::backdrop { background:rgba(20,20,20,.6); }
  form label { display:block; margin:12px 0 4px; font-size:11px; color:var(--mute); }
  form input[type=text], form input[type=date], form select, form textarea { width:100%; }
  .dr { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .fl { font-size:13px; display:flex; justify-content:space-between; gap:8px; margin-top:6px; }
  .fl a { color:var(--accd); }
</style>
</head>
<body>
<div class="top">
  <b>Mis tareas</b>
  <div class="r">
    <button id="exp" title="Un solo fichero con tareas y archivos">Exportar copia</button>
    <button id="imp">Importar copia</button>
    <input id="impf" type="file" accept=".json" hidden>
    <button class="primary" id="add">+ Nueva tarea</button>
  </div>
</div>

<div class="wrap">
  <aside>
    <div class="big mono" style="font-family:inherit;text-transform:none"><span id="nOpen">0</span><i></i></div>
    <div class="lbl">tareas abiertas</div>
    <div class="tags mono" id="tags"></div>

    <div class="box">
      <h3 class="mono">Archivos sueltos (sin clasificar)</h3>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Añadir archivos sueltos">Suelta aquí Excel, docs o PDF<br><span class="mono" style="font-size:12px;color:var(--mute)">o haz clic para elegir</span></div>
      <input id="gfile" type="file" multiple hidden>
      <div id="gList"></div>
    </div>
  </aside>

  <section>
    <div class="chips" id="chips"></div>
    <div class="chips" style="margin-top:10px">
      <select id="fProj" aria-label="Filtrar por proyecto"><option value="">Todos los proyectos</option></select>
      <input id="q" type="search" placeholder="Buscar…" aria-label="Buscar">
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dt" style="margin:0">Nueva tarea</h3>
    <label class="mono">Título</label><input type="text" id="fTitle" required>
    <label class="mono">Proyecto / etiqueta</label><select id="fProjIn"></select>
    <label class="mono">Fecha límite</label><input type="date" id="fDue">
    <label class="mono">Estado</label>
    <select id="fState"><option value="todo">Pendiente</option><option value="doing">En curso</option><option value="done">Hecho</option></select>
    <label class="mono">Notas</label><textarea id="fNotes" rows="3"></textarea>
    <label class="mono">Archivos de esta tarea</label><input type="file" id="fFiles" multiple>
    <div id="fList"></div>
    <div class="dr"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Guardar</button></div>
  </form>
</dialog>

<script>
const PROJECTS = [
  { g:'Talgo', items:['Talgo'] },
  { g:'Máster', items:['SIF','GMC','Fuentes de energía','Automatización'] },
  { g:'Fútbol', items:['Fútbol'] },
];
const groupOf = p => (PROJECTS.find(x => x.items.includes(p)) || {}).g;
const projLabel = p => { const g = groupOf(p); return !p ? '' : g && g !== p ? `${g} · ${p}` : p; };
const projOptions = (cur, all) => {
  const known = PROJECTS.flatMap(x => x.items);
  const sel = v => v === cur ? 'selected' : '';
  let h = all ? `<option value="">Todos los proyectos</option>` : `<option value="">(sin proyecto)</option>`;
  for (const x of PROJECTS) {
    h += `<optgroup label="${esc(x.g)}">`;
    if (all && x.items.length > 1) h += `<option value="g:${esc(x.g)}" ${sel('g:'+x.g)}>Todo ${esc(x.g)}</option>`;
    h += x.items.map(i => `<option value="${all?'p:':''}${esc(i)}" ${sel((all?'p:':'')+i)}>${esc(i)}</option>`).join('') + `</optgroup>`;
  }
  const legacy = [...new Set(tasks.map(t => t.proj).filter(p => p && !known.includes(p)))];
  if (cur && !all && !known.includes(cur) && !legacy.includes(cur)) legacy.push(cur);
  if (legacy.length) h += `<optgroup label="Otros">` + legacy.map(i => `<option value="${all?'p:':''}${esc(i)}" ${sel((all?'p:':'')+i)}>${esc(i)}</option>`).join('') + `</optgroup>`;
  return h;
};
const matchProj = (t, f) => !f || (f.startsWith('g:') ? groupOf(t.proj) === f.slice(2) : t.proj === f.slice(2));
const STATES = { todo:'Pendiente', doing:'En curso', done:'Hecho' };
let tasks = [], general = [], editing = null, pending = [], view = 'open';

// ---------- Almacenamiento (IndexedDB, admite archivos grandes) ----------
const DB = new Promise((res, rej) => {
  const r = indexedDB.open('mis-tareas', 2);
  r.onupgradeneeded = () => {
    const db = r.result;
    if (!db.objectStoreNames.contains('tasks')) db.createObjectStore('tasks', { keyPath:'id' });
    if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath:'id' });
  };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const tx = async (store, mode, fn) => { const db = await DB; return new Promise((res, rej) => {
  const t = db.transaction(store, mode); const out = fn(t.objectStore(store));
  t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
const getAll = s => tx(s, 'readonly', o => o.getAll());
const put = (s, x) => tx(s, 'readwrite', o => o.put(x));
const del = (s, id) => tx(s, 'readwrite', o => o.delete(id));

// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const size = n => n > 1e6 ? (n/1e6).toFixed(1).replace('.',',')+' MB' : Math.max(1,Math.round(n/1e3))+' KB';
const fmt = d => d ? new Date(d+'T00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'}).replace('.','') : '';
const isLate = t => t.state !== 'done' && t.due && t.due < today();
const download = f => { const a = document.createElement('a'); a.href = URL.createObjectURL(f.blob); a.download = f.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); };
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

async function refresh() { [tasks, general] = await Promise.all([getAll('tasks'), getAll('files')]); render(); }

// ---------- Archivos sueltos ----------
async function addGeneral(fileList) {
  for (const f of fileList) await put('files', { id:newId(), name:f.name, size:f.size, type:f.type, blob:f, added:Date.now() });
  refresh();
}
$('drop').onclick = () => $('gfile').click();
$('drop').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('gfile').click(); } };
$('gfile').onchange = e => { addGeneral([...e.target.files]); e.target.value = ''; };
['dragover','dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, () => $('drop').classList.remove('over')));
$('drop').addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) addGeneral([...e.dataTransfer.files]); });

$('gList').onclick = async e => {
  const d = e.target.dataset;
  if (d.gdl) download(general.find(f => f.id === d.gdl));
  if (d.grm && confirm('¿Borrar este archivo?')) { await del('files', d.grm); refresh(); }
};
$('gList').onchange = async e => {
  const id = e.target.dataset.gas; if (!id || !e.target.value) return;
  const f = general.find(x => x.id === id), t = tasks.find(x => x.id === e.target.value);
  t.files = [...(t.files || []), { name:f.name, size:f.size, type:f.type, blob:f.blob }];
  await put('tasks', t); await del('files', id); refresh();
};

// ---------- Render ----------
function render() {
  const fp = $('fProj').value, q = $('q').value.toLowerCase();
  const open = tasks.filter(t => t.state !== 'done'), late = tasks.filter(isLate);
  $('nOpen').textContent = String(open.length).padStart(2, '0');
  $('tags').innerHTML = (late.length ? `<span class="mint warn">${late.length} vencida${late.length>1?'s':''}</span>` : '')
    + `<span class="mint">${open.filter(t => t.files?.length).length} con archivos</span>`
    + `<span class="mint">${general.length} sueltos</span>`;

  const chips = [['open','Abiertas',''],['late',`Vencidas (${late.length})`,'warn'],['done','Hechas',''],['all','Todas','']];
  $('chips').innerHTML = chips.map(([k,n,c]) => `<button class="chip mono ${c}" data-v="${k}" aria-pressed="${view===k}">${n}</button>`).join('');

  $('fProj').innerHTML = projOptions(fp, true);

  let vis = tasks.filter(t => matchProj(t, fp) && (!q || (t.title+' '+(t.notes||'')+' '+(t.proj||'')).toLowerCase().includes(q)));
  vis = vis.filter(t => view==='all' ? true : view==='done' ? t.state==='done' : view==='late' ? isLate(t) : t.state!=='done');
  const byDue = (a,b) => (a.due||'9999').localeCompare(b.due||'9999') || a.created - b.created;
  const groups = view === 'done' || view === 'all' && false ? [['',vis]] : [
    ['Vencidas', vis.filter(isLate).sort(byDue), 'warn'],
    ['Con fecha', vis.filter(t => t.state!=='done' && !isLate(t) && t.due).sort(byDue)],
    ['Sin fecha', vis.filter(t => t.state!=='done' && !t.due)],
    ['Hechas', vis.filter(t => t.state==='done').sort(byDue)],
  ];
  const showHead = groups.filter(g => g[1].length).length > 1 || view === 'late';
  $('list').innerHTML = vis.length ? groups.filter(g => g[1].length).map(([n, items, c]) =>
    (showHead && n ? `<div class="grp mono ${c||''}">${n} · ${items.length}</div>` : '') + items.map(row).join('')).join('')
    : `<div class="empty">${view==='late'?'No tienes tareas vencidas.':'No hay tareas aquí.'}</div>`;

  $('gList').innerHTML = general.length ? general.map(f => `<div class="gf">
      <a class="n" data-gdl="${f.id}">📎 ${esc(f.name)}</a><span class="mono" style="font-size:11px">${size(f.size)}</span>
      <select data-gas="${f.id}" aria-label="Asignar a una tarea"><option value="">Asignar a tarea…</option>${open.map(t => `<option value="${t.id}">${esc(t.title.slice(0,40))}</option>`).join('')}</select>
      <button data-grm="${f.id}">Borrar</button></div>`).join('') : '';

  document.querySelectorAll('.row').forEach(r => {
    r.ondragover = e => { e.preventDefault(); r.classList.add('over'); };
    r.ondragleave = () => r.classList.remove('over');
    r.ondrop = async e => { e.preventDefault(); r.classList.remove('over');
      const t = tasks.find(x => x.id === r.dataset.id); if (!t || !e.dataTransfer.files.length) return;
      t.files = [...(t.files||[]), ...[...e.dataTransfer.files].map(f => ({ name:f.name, size:f.size, type:f.type, blob:f }))];
      await put('tasks', t); refresh(); };
  });
}

function row(t) {
  const late = isLate(t);
  const date = t.state==='done' ? 'HECHA' : t.due ? `${fmt(t.due)}${late?'<br>VENCIDA':t.state==='doing'?'<br>EN CURSO':''}` : (t.state==='doing'?'EN CURSO':'—');
  const next = t.state==='todo' ? ['doing','Empezar'] : t.state==='doing' ? ['done','Hecho ✓'] : ['todo','Reabrir'];
  return `<div class="row ${late?'late':''} ${t.state}" data-id="${t.id}">
    <div class="dt mono">${date}</div>
    <div><div class="ti">${esc(t.title)}</div>
      ${t.notes?`<div class="nt">${esc(t.notes)}</div>`:''}
      ${t.files?.length?`<div class="files">${t.files.map((f,i)=>`<a data-dl="${t.id}:${i}">📎 ${esc(f.name)} (${size(f.size)})</a>`).join('')}</div>`:''}
      <div class="acts mono"><button data-mv="${t.id}:${next[0]}">${next[1]}</button>${t.state==='todo'?`<button data-mv="${t.id}:done">Hecho ✓</button>`:''}<button data-ed="${t.id}">Editar</button><button data-rm="${t.id}">Borrar</button></div>
    </div>
    ${t.proj?`<span class="pill mono">${esc(projLabel(t.proj))}</span>`:'<span></span>'}
  </div>`;
}

$('chips').onclick = e => { if (e.target.dataset.v) { view = e.target.dataset.v; render(); } };
$('fProj').onchange = $('q').oninput = render;
$('list').onclick = async e => {
  const b = e.target.dataset;
  if (b.mv) { const [id, s] = b.mv.split(':'); const t = tasks.find(x => x.id === id); t.state = s; await put('tasks', t); refresh(); }
  if (b.ed) openDlg(tasks.find(x => x.id === b.ed));
  if (b.rm && confirm('¿Borrar la tarea y sus archivos?')) { await del('tasks', b.rm); refresh(); }
  if (b.dl) { const [id, i] = b.dl.split(':'); download(tasks.find(x => x.id === id).files[i]); }
};

// ---------- Diálogo de tarea ----------
function openDlg(t) {
  editing = t || null; pending = t ? [...(t.files || [])] : [];
  $('dt').textContent = t ? 'Editar tarea' : 'Nueva tarea';
  $('fTitle').value = t?.title || ''; $('fProjIn').innerHTML = projOptions(t?.proj || '', false); $('fDue').value = t?.due || '';
  $('fState').value = t?.state || 'todo'; $('fNotes').value = t?.notes || ''; $('fFiles').value = '';
  drawFiles(); $('dlg').showModal();
}
function drawFiles() {
  $('fList').innerHTML = pending.map((f, i) => `<div class="fl"><span>📎 ${esc(f.name)} (${size(f.size)})</span><a href="#" data-x="${i}">quitar</a></div>`).join('');
}
$('fList').onclick = e => { if (e.target.dataset.x !== undefined) { e.preventDefault(); pending.splice(+e.target.dataset.x, 1); drawFiles(); } };
$('fFiles').onchange = e => { for (const f of e.target.files) pending.push({ name:f.name, size:f.size, type:f.type, blob:f }); e.target.value = ''; drawFiles(); };
$('add').onclick = () => openDlg(null);
$('cancel').onclick = () => $('dlg').close();
$('form').onsubmit = async () => {
  const t = editing || { id:newId(), created:Date.now() };
  Object.assign(t, { title:$('fTitle').value.trim(), proj:$('fProjIn').value, due:$('fDue').value, state:$('fState').value, notes:$('fNotes').value, files:pending });
  await put('tasks', t); refresh();
};

// ---------- Copia de seguridad ----------
const toB64 = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
const pack = async f => ({ name:f.name, size:f.size, type:f.type, data:await toB64(f.blob) });
const unpack = async x => ({ name:x.name, size:x.size, type:x.type, blob:await (await fetch(x.data)).blob() });
$('exp').onclick = async () => {
  const out = { v:2, tasks:[], general:[] };
  for (const t of tasks) out.tasks.push({ ...t, files: await Promise.all((t.files||[]).map(pack)) });
  for (const g of general) out.general.push({ id:g.id, added:g.added, ...(await pack(g)) });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type:'application/json' }));
  a.download = `tareas-${today()}.json`; a.click();
};
$('imp').onclick = () => $('impf').click();
$('impf').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    let data = JSON.parse(await f.text()); if (Array.isArray(data)) data = { tasks:data, general:[] };
    for (const t of data.tasks) { t.files = await Promise.all((t.files||[]).map(unpack)); await put('tasks', t); }
    for (const g of data.general || []) { const u = await unpack(g); await put('files', { id:g.id || newId(), added:g.added || Date.now(), ...u }); }
    refresh(); alert(`Importadas ${data.tasks.length} tareas y ${(data.general||[]).length} archivos sueltos.`);
  } catch { alert('El archivo no es una copia válida.'); }
  e.target.value = '';
};

refresh();
</script>
</body>
</html>
