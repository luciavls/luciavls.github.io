<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logros · LV</title>
<meta name="description" content="Trabajos finales, certificados y proyectos para descargar.">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="../favicon-64.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#111213">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  /* Portfolio oscuro: rejilla de tarjetas con portada de color y el título abreviado en grande. */
  :root {
    --bg:#111213; --card:#1b1c1f; --line:#2c2d31; --line2:#3c3d42; --ink:#f0efec; --ink2:#c3c2bd; --mute:#8d9096; --acc:#ee6a45; --on-acc:#141414;
    --f:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif; --m:"JetBrains Mono",ui-monospace,Menlo,monospace;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 var(--f); -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1180px; margin:0 auto; padding-left:max(20px, env(safe-area-inset-left, 0px)); padding-right:max(20px, env(safe-area-inset-right, 0px)); }
  header { display:flex; align-items:center; gap:12px; padding-block:26px 0; }
  .logo { --s:34px; position:relative; flex:none; width:var(--s); height:var(--s); border-radius:calc(var(--s)*.22); background:var(--ink); color:#141414; display:grid; place-items:center;
          font:800 calc(var(--s)*.46)/1 var(--f); letter-spacing:-.06em; overflow:hidden; }
  .logo span { position:relative; z-index:1; transform:translate(-2%,-4%); }
  .logo i { position:absolute; right:12%; bottom:12%; width:26%; height:26%; background:var(--acc); }
  header b { display:block; font-size:15px; }
  header small { display:block; font-size:12px; color:var(--mute); }
  h1 { font-size:clamp(44px, 7vw, 80px); letter-spacing:-.05em; line-height:.9; margin:34px 0 10px; font-weight:800; text-wrap:balance; }
  h1 em { font-style:normal; color:var(--acc); }
  .lead { color:var(--mute); margin:0 0 20px; max-width:60ch; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:99px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:var(--line2); }
  .chip[aria-pressed="true"] { background:var(--ink); color:#141414; border-color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:18px; margin:24px 0 70px; }
  @media (max-width:400px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; transition:transform .2s, border-color .2s; min-width:0; }
  .card:hover { transform:translateY(-3px); border-color:var(--line2); }
  .cov { position:relative; height:150px; overflow:hidden; display:flex; align-items:flex-end; padding:14px 18px;
         background:radial-gradient(circle at 28% 30%, var(--cc) 0, color-mix(in srgb, var(--cc) 0%, transparent) 62%), var(--card); }
  .cov .ab { font:800 64px/.85 var(--f); letter-spacing:-.06em; color:#111213; white-space:nowrap; }
  .cov .k { position:absolute; right:14px; top:14px; font:500 11px var(--m); text-transform:uppercase; letter-spacing:.08em; color:var(--ink); background:rgba(17,18,19,.55); padding:4px 8px; border-radius:99px; }
  .bd { padding:16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .mt { font:500 11px var(--m); color:var(--acc); text-transform:uppercase; letter-spacing:.08em; }
  .card h2 { margin:0; font-size:20px; letter-spacing:-.01em; line-height:1.15; text-wrap:balance; }
  .card p { margin:0; color:var(--ink2); font-size:14px; white-space:pre-wrap; }
  .files { display:grid; gap:6px; margin-top:6px; }
  .file { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:#232428; color:var(--ink); text-decoration:none; font-size:13px; min-width:0; }
  .file:hover { background:#2a2b30; }
  .file b { font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file small { color:var(--mute); font-variant-numeric:tabular-nums; flex:none; }
  .ftag { font:600 10px/1 var(--m); color:#fff; background:var(--c, #8e9097); border-radius:5px; padding:4px 6px; letter-spacing:.04em; flex:none; }
  .foot { display:flex; justify-content:flex-end; margin-top:auto; padding-top:10px; }
  .btn { display:inline-flex; align-items:center; gap:6px; background:var(--acc); color:var(--on-acc); border:0; border-radius:99px; padding:8px 14px; font:600 13px var(--f); cursor:pointer; text-decoration:none; }
  .btn:hover { filter:brightness(1.07); }
  .btn:disabled { opacity:.6; cursor:wait; }
  .empty { padding:60px 0; color:var(--mute); text-align:center; }
  footer { border-top:1px solid var(--line); padding-block:22px 40px; color:var(--mute); font-size:12px; }
  footer a { color:var(--ink2); }
  a:focus-visible, button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { .card { transition:none; } .card:hover { transform:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="logo" aria-hidden="true"><i></i><span>LV</span></span><div><b id="who">LV</b><small>Logros</small></div></header>
  <h1>Logros<em>.</em></h1>
  <p class="lead">Trabajos finales, certificados y proyectos. Pulsa un archivo para descargarlo.</p>
  <div class="chips" id="chips"></div>
  <main class="grid" id="grid" aria-live="polite"><div class="empty" style="grid-column:1/-1">Cargando…</div></main>
</div>
<footer><div class="wrap">Página de logros de <span id="who2">LV</span>.</div></footer>

<script>
const SUPABASE_URL = 'https://mjyxhojdllxwjxhtntey.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Xy7_AgVFpMXvPTcJ4qCynQ_00txJjsP';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MS = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
const fdate = s => { if (!s) return ''; const d = new Date(s + 'T00:00'); return `${d.getDate()} ${MS[d.getMonth()]} ${d.getFullYear()}`; };
const size = n => n > 1e6 ? (n/1e6).toFixed(1).replace('.',',') + ' MB' : Math.max(1, Math.round((n||0)/1e3)) + ' KB';
const extOf = n => (String(n).match(/\.([^./\\]+)$/) || [,''])[1].toLowerCase();
const baseOf = n => String(n).replace(/\.[^./\\]+$/, '') || 'archivo';
const FT = { pdf:'#e5534b', doc:'#3d8be8', docx:'#3d8be8', xls:'#3fb563', xlsx:'#3fb563', csv:'#3fb563', ppt:'#ee6a45', pptx:'#ee6a45', zip:'#a46be6', rar:'#a46be6', jpg:'#e2ad2a', jpeg:'#e2ad2a', png:'#e2ad2a' };
const ftag = n => { const e = extOf(n) || 'file'; return `<span class="ftag" style="--c:${FT[e] || '#8e9097'}">${esc(e.toUpperCase().slice(0, 4))}</span>`; };
const initials = t => (String(t).match(/[A-Za-zÁÉÍÓÚÑáéíóúñ0-9]+/g) || []).filter(w => w.length > 2 || /^[A-Z0-9]+$/.test(w)).map(w => /^[A-Z0-9]{2,}$/.test(w) ? w : w[0].toUpperCase()).join('').slice(0, 5) || '★';
const pubUrl = (path, name) => `${SUPABASE_URL}/storage/v1/object/public/logros/${path.split('/').map(encodeURIComponent).join('/')}?download=${encodeURIComponent(name)}`;

let all = [], cat = '';
function render() {
  const cats = [...new Set(all.map(a => a.category).filter(Boolean))];
  $('chips').innerHTML = cats.length > 1 ? ['', ...cats].map(c => `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === cat}">${c ? esc(c) : 'Todos'}</button>`).join('') : '';
  const list = all.filter(a => !cat || a.category === cat);
  $('grid').innerHTML = list.length ? list.map(a => {
    const files = a.files || [];
    return `<article class="card">
      <div class="cov" style="--cc:${esc(a.color || '#ee6a45')}">${a.category ? `<span class="k">${esc(a.category)}</span>` : ''}<span class="ab" aria-hidden="true">${esc((a.cover_text || '').trim() || initials(a.title))}</span></div>
      <div class="bd">
        ${a.date ? `<span class="mt">${fdate(a.date)}</span>` : ''}
        <h2>${esc(a.title)}</h2>
        ${a.description ? `<p>${esc(a.description)}</p>` : ''}
        ${files.length ? `<div class="files">${files.map(f => `<a class="file" href="${esc(pubUrl(f.path, f.name))}" download="${esc(f.name)}">${ftag(f.name)}<b>${esc(f.name)}</b><small>${size(f.size)} ↓</small></a>`).join('')}</div>` : ''}
        ${files.length > 1 ? `<div class="foot"><button class="btn" data-zip="${a.id}">↓ Descargar todo (${files.length})</button></div>` : ''}
      </div></article>`;
  }).join('') : `<div class="empty" style="grid-column:1/-1">Todavía no hay logros publicados.</div>`;
}
$('chips').onclick = e => { const c = e.target.closest('[data-c]'); if (c) { cat = c.dataset.c; render(); } };

// Descargar todo: junta los archivos de un logro en un .zip
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
async function makeZip(entries) {
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0; const used = new Set();
  const now = new Date(), dt = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1), dd = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const { name, blob } of entries) {
    let nm = name || 'archivo', k = 2; while (used.has(nm)) nm = `${baseOf(name)} (${k++})${extOf(name) ? '.' + extOf(name) : ''}`; used.add(nm);
    const nb = enc.encode(nm), data = new Uint8Array(await blob.arrayBuffer()), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(10, dt, true); h.setUint16(12, dd, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true);
    parts.push(h.buffer, nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(12, dt, true); c.setUint16(14, dd, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true); c.setUint32(42, offset, true);
    central.push(c.buffer, nb); offset += 30 + nb.length + data.length;
  }
  const cd = central.reduce((s, p) => s + p.byteLength, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, entries.length, true); e.setUint16(10, entries.length, true); e.setUint32(12, cd, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, e.buffer], { type:'application/zip' });
}
$('grid').onclick = async e => {
  const b = e.target.closest('[data-zip]'); if (!b) return;
  const a = all.find(x => x.id === b.dataset.zip); if (!a) return;
  const label = b.textContent; b.disabled = true; b.textContent = 'Preparando…';
  try {
    const entries = [];
    for (const f of a.files) { const r = await fetch(pubUrl(f.path, f.name)); if (!r.ok) throw new Error(r.status); entries.push({ name:f.name, blob:await r.blob() }); }
    const url = URL.createObjectURL(await makeZip(entries)), link = document.createElement('a');
    link.href = url; link.download = (a.title.replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 60) || 'logro') + '.zip';
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
    b.textContent = label;
  } catch { b.textContent = 'No se pudo. Descarga los archivos uno a uno.'; setTimeout(() => { b.textContent = label; }, 4000); }
  b.disabled = false;
};

(async function start() {
  try {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:false } });
    const { data:owner } = await sb.from('logros_owner').select('user_id,display_name').maybeSingle();
    if (owner) { $('who').textContent = $('who2').textContent = owner.display_name; document.title = `Logros · ${owner.display_name}`; }
    const q = sb.from('achievements').select('*').eq('published', true).order('date', { ascending:false, nullsFirst:false }).order('created_at', { ascending:false });
    const { data, error } = owner ? await q.eq('user_id', owner.user_id) : { data:[], error:null };
    if (error) throw error;
    all = data; render();
  } catch { $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">No se pudieron cargar los logros. Recarga la página.</div>'; }
})();
</script>
</body>
</html>
